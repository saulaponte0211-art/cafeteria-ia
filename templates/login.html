{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
  <h1>Entrar 🔐</h1>
  {% if error %}<div class="aviso error">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Correo institucional
      <input type="text" name="email" placeholder="tu@cafeteria.edu" required autofocus>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button class="boton">Entrar</button>
  </form>
  <p class="nota">
    ¿Primera vez? Usa la cuenta de prueba <code>ana@cafeteria.edu</code> / <code>ana12345</code>
    o <a href="{{ url_for('web.registro') }}">crea tu cuenta</a>.
  </p>
</section>
{% endblock %}
